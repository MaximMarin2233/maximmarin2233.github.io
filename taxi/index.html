<!DOCTYPE html>
<html lang="ru" class="page">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- <link rel="icon" href="/favicon.svg" type="image/svg+xml"> -->
  <meta http-equiv="X-UA-Compatible" content="ie=edge">
  <meta name="theme-color" content="#111111">

  <title>Taxi</title>

  <style>
    .correct {
      background: #4caf50;
      color: white;
    }
  </style>

  <link rel="stylesheet" href="css/vendor.css">
  <link rel="stylesheet" href="css/main.css">
  <script defer src="js/main.js"></script>
</head>

<body class="page__body">
  <div class="site-container">
    <header class="header">
      <div class="container">

      </div>
    </header>
    <main class="main">
      <section class="hero">
        <div class="container">
          <div class="btns-wrapper" style="margin-bottom: 15px;">
            <button onclick="speakQueue(['Это правильный ответ!'])">✅ Правильно!</button>
            <button onclick="speakQueue(['Это неправильный ответ!'])">❌ Неправильно!</button>
          </div>
          <div class="swiper">

            <div class="swiper-button-prev"></div>
            <div class="swiper-button-next"></div>

            <div class="swiper-wrapper" id="slides"></div>
          </div>
        </div>
      </section>
    </main>
    <footer class="footer">
      <div class="container">

      </div>
    </footer>

  </div>

  <script>
    let selectedVoice = null;

    function loadVoices() {
      const voices = speechSynthesis.getVoices();

      selectedVoice = voices.find(v =>
        v.name === "Google русский" && v.lang === "ru-RU"
      );
    }

    speechSynthesis.onvoiceschanged = loadVoices;
    loadVoices();

    const PAUSE = 300;

    function speakQueue(parts) {
      speechSynthesis.cancel();

      let index = 0;

      function next() {
        if (index >= parts.length) return;

        const utterance = new SpeechSynthesisUtterance(parts[index]);

        if (selectedVoice) {
          utterance.voice = selectedVoice;
        }

        utterance.lang = "ru-RU";
        utterance.rate = 1;
        utterance.pitch = 1;

        utterance.onend = () => {
          index++;
          setTimeout(next, PAUSE);
        };

        speechSynthesis.speak(utterance);
      }

      next();
    }

    function showAnswer(index) {
      const answers = document.querySelectorAll(`#q${index} .answer`);
      const correctIndex = questions[index].correct;

      const isActive = answers[correctIndex].classList.contains('correct');

      if (isActive) {
        answers.forEach(a => a.classList.remove('correct'));
        return;
      }

      answers.forEach(a => a.classList.remove('correct'));
      answers[correctIndex].classList.add('correct');
    }

    const questions = [
      {
        question: "Фамилия ведущего программы Такси на ТНТ?",
        answers: ["Бондарчук", "Нагиев", "Куличков", "Борисов", "Куценко"],
        correct: 2
      },
      {
        question: "Какая из этих птиц в России не улетает на юг зимой?",
        answers: ["Грач", "Цапля", "Галка", "Дрозд", "Снегирь"],
        correct: 4
      },
      {
        question: "Из чего был сделан домик у поросёнка Нуф-Нуф?",
        answers: ["Кирпичи", "Солома", "Камни", "Ветки", "Снег"],
        correct: 3
      },
      {
        question: "Самая распространённая фамилия в России?",
        answers: ["Иванов", "Смирнов", "Сидоров", "Петров", "Васильев"],
        correct: 1
      },
      {
        question: "Кто такой пестун?",
        answers: ["Оружейник", "Наставник", "Порода собак", "Политический деятель", "Певец"],
        correct: 1
      },
      {
        question: "У какого животного самые большие глаза?",
        answers: ["Кальмар", "Бегемот", "Слон", "Косатка", "Страус"],
        correct: 0
      },
      {
        question: "Какую цифру не любят в Китае?",
        answers: ["1", "4", "7", "9", "13"],
        correct: 1
      },
      {
        question: "Оттенки какого цвета человек различает лучше всего?",
        answers: ["Красный", "Синий", "Серый", "Зелёный", "Чёрный"],
        correct: 3
      },
      {
        question: "Чей сплав называется электрум?",
        answers: ["Золото и серебро", "Золото и медь", "Железо и медь", "Серебро и свинец", "Никель и цинк"],
        correct: 0
      },
      {
        question: "Как раньше называли Томск?",
        answers: ["Столица Сибири", "Великое Междуречье", "Сибирские Афины", "Таёжный тупик", "Молодой Гарлем"],
        correct: 2
      },
      {
        question: "Сколько оленей в упряжке Санта-Клауса?",
        answers: ["2", "4", "6", "7", "9"],
        correct: 4
      },
      {
        question: "Как звали первую жену Адама?",
        answers: ["Мария", "Ева", "Пенни", "Лилит", "Лилу"],
        correct: 3
      },
      {
        question: "В какой стране находится гора Арарат?",
        answers: ["Армения", "Азербайджан", "Грузия", "Турция", "Россия"],
        correct: 3
      },
      {
        question: "Что такое маис?",
        answers: ["Рис", "Кукуруза", "Помидор", "Картофель", "Гречка"],
        correct: 1
      },
      {
        question: "Сколько игроков было в сериале Игра в кальмара?",
        answers: ["124", "246", "300", "456", "666"],
        correct: 3
      },
      {
        question: "Каких видов часов не бывает?",
        answers: ["Песочные", "Механические", "Солнечные", "Магнитные", "Атомные"],
        correct: 3
      },
      {
        question: "Какую картину продали дороже всего?",
        answers: ["Спаситель мира", "Крик", "Мальчик с трубкой", "Чёрный квадрат", "Звёздная ночь"],
        correct: 0
      },
      {
        question: "Что из этого изобрела женщина?",
        answers: ["Телеграф", "Посудомоечная машина", "Телефон", "Стиральная машина", "Швейная машина"],
        correct: 1
      },
      {
        question: "Какой сферы нет в атмосфере?",
        answers: ["Тропосфера", "Литосфера", "Стратосфера", "Мезосфера", "Термосфера"],
        correct: 1
      },
      {
        question: "Сколько рёбер у человека?",
        answers: ["12", "15", "18", "24", "32"],
        correct: 3
      }
    ];

    const container = document.getElementById('slides');

    questions.forEach((q, i) => {
      const slide = document.createElement('div');
      slide.className = 'swiper-slide';

      const speechParts = [
        `Вопрос ${i + 1}`,
        q.question,
        ...q.answers
      ];

      slide.innerHTML = `
    <div id="q${i}">
      <b>Вопрос ${i + 1}</b>
      <br><br>

      ${q.question}<br><br>

      ${q.answers.map((a, ai) => `
        <div class="answer">${ai + 1}. ${a}</div>
      `).join('')}

      <br><br><br><br>

      <button class="btn-answer" onclick='speakQueue(${JSON.stringify(speechParts)})'>
        Озвучить 🔊
      </button>

      <button class="btn-answer" onclick='showAnswer(${i})'>
        Ответ
      </button>
    </div>
  `;

      container.appendChild(slide);
    });
  </script>
</body>

</html>
